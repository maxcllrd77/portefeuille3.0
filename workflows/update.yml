name: Automatisation portefeuille
on:
  schedule:
    - cron: '30 18 * * 1-5'
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance
      - run: python fetch.py
      - run: python news.py
      - run: |
          git config user.name 'portfolio-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add data/prices.json data/news.json
          git diff --staged --quiet || git commit -m 'Automated market data and news update'
          git push
